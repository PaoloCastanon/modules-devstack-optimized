name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install local verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ansible-core

      - name: Set up Terraform for format checks only
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Set up Go when the implementation exists
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify repository without starting the laboratory
        run: make check

      - name: Show implementation inventory
        run: make harness-status
