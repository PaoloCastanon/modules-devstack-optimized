name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install local verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ansible-core

      - name: Set up Terraform for format checks only
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Set up Go when the implementation exists
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify repository without starting the laboratory
        run: make check

      - name: Show implementation inventory
        run: make harness-status
